  <!-- アイコン（ページ内に直接持つ） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-up" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>

    <symbol id="i-pie" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>

    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>

  <header class="mb-3 mt-1 px-2 flex justify-between items-end gap-2">
    <div class="min-w-0">
      <h1 class="text-2xl font-bold tracking-tight text-app-text">MoneyLog</h1>
      <div class="flex items-center gap-1 mt-0.5 -ml-2">
        <button onclick="App.shiftMonth(-1)" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 hover:bg-white transition-colors" aria-label="前の月"><svg class="ic"><use href="#i-left"/></svg></button>

    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <div class="flex items-center gap-2">

      <p class="text-xs text-gray-500 mt-3 leading-relaxed">データはこの端末のブラウザの中だけに保存されています。ファイルに保存しておくと、機種変更やブラウザのデータ削除のあとでも元に戻せます。</p>

      <p class="text-[11px] text-gray-400 mt-2">読み込むと、今のデータはファイルの内容に置き換わります。</p>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-app-text/90 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg hidden max-w-[90vw] text-center"></div>

  <script>
    // --- Utilities ---
    const generateId = () => Math.random().toString(36).slice(2, 11);
    const $ = (id) => document.getElementById(id);

    const formatCurrency = (amount) =>
      new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(amount || 0);
    const formatDiff = (diff) => {
      if (diff > 0) return '+' + formatCurrency(diff);
      if (diff < 0) return formatCurrency(diff);
      return '±' + formatCurrency(0);
    };
    const formatNumber = (n) => (n ? Number(n).toLocaleString('ja-JP') : '');

    // 金額の入力を整数（0以上）にする。全角数字やカンマも受け付ける
    const parseAmount = (str) => {
      const digits = String(str).normalize('NFKC').replace(/[^\d]/g, '');
      return digits ? Math.min(Number(digits), 999999999) : 0;
    };

    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    };

    const monthKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const shiftKey = (key, delta) => {
      const [y, m] = key.split('-').map(Number);
      return monthKey(new Date(y, m - 1 + delta, 1));
    };
    const monthLabel = (key) => { const [y, m] = key.split('-').map(Number); return `${y}年 ${m}月`; };
    const monthRange = (key) => {
      const [y, m] = key.split('-').map(Number);
      const last = new Date(y, m, 0).getDate();
      return { start: `${key}-01`, end: `${key}-${String(last).padStart(2, '0')}` };
    };

    const STORAGE_KEY = 'moneylog_v2';
    const OLD_KEY = 'moneylog_data';
    const BACKUP_KEY = 'moneylog_last_backup';

    const defaultMonth = () => ({
      jobs: [{ id: generateId(), name: 'メインの仕事', amount: 0, startDate: '', endDate: '' }],
      expenses: {
        fixed: [
          { id: generateId(), name: '家賃', target: 0, actual: 0 },
          { id: generateId(), name: '水道光熱費', target: 0, actual: 0 },
          { id: generateId(), name: '通信費', target: 0, actual: 0 }
        ],
        variable: [
          { id: generateId(), name: '食費', target: 0, actual: 0 },
          { id: generateId(), name: '交際費', target: 0, actual: 0 },
          { id: generateId(), name: '日用品', target: 0, actual: 0 }
        ]
      }
    });

    // 1か月分のデータの形を整える（読み込んだファイルや古いデータ用）
    const cleanMonth = (m) => {
      const num = (v) => Math.max(0, Math.round(Number(v) || 0));
      const str = (v) => (typeof v === 'string' ? v : '');
      const date = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '');
      const exp = (list) => (Array.isArray(list) ? list : []).map(e => ({
        id: str(e && e.id) || generateId(), name: str(e && e.name), target: num(e && e.target), actual: num(e && e.actual)
      }));
      const jobs = (Array.isArray(m && m.jobs) ? m.jobs : []).map(j => ({
        id: str(j && j.id) || generateId(), name: str(j && j.name), amount: num(j && j.amount),
        startDate: date(j && j.startDate), endDate: date(j && j.endDate)
      }));
      if (jobs.length === 0) jobs.push({ id: generateId(), name: 'メインの仕事', amount: 0, startDate: '', endDate: '' });
      return { jobs, expenses: { fixed: exp(m && m.expenses && m.expenses.fixed), variable: exp(m && m.expenses && m.expenses.variable) } };
    };

    const cleanData = (d) => {
      if (!d || typeof d !== 'object' || !d.months || typeof d.months !== 'object') return null;
      const months = {};
      Object.keys(d.months).forEach(k => { if (/^\d{4}-\d{2}$/.test(k)) months[k] = cleanMonth(d.months[k]); });
      return { version: 2, months };
    };

    // --- Application Logic ---
    const App = {
      data: { version: 2, months: {} },
      viewKey: monthKey(),
      followCurrent: true,
      activeJobId: null,
      confirmHandler: null,

      init() {
        this.load();
        this.setupConfirm();

        // 開きっぱなしで月が変わったら、今月の表示に切り替える
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && this.followCurrent && this.viewKey !== monthKey()) this.goThisMonth();
        });
        // 別のタブでの変更を反映する
        window.addEventListener('storage', (e) => {
          if (e.key === STORAGE_KEY) { this.load(); this.renderAll(); }
        });

        this.renderAll();
      },

      load() {
        let data = null;
        try { data = cleanData(JSON.parse(localStorage.getItem(STORAGE_KEY))); } catch (e) {}
        if (!data) {
          data = { version: 2, months: {} };
          // 以前の形式のデータがあれば今月のデータとして引き継ぐ（元のデータは消さずに残す）
          try {
            const old = JSON.parse(localStorage.getItem(OLD_KEY));
            if (old && (old.jobs || old.expenses)) data.months[monthKey()] = cleanMonth(old);
          } catch (e) {}
          this.data = data;
          if (Object.keys(data.months).length) this.persist();
        }
        this.data = data;
      },

      persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
        } catch (e) {
          this.toast('保存できませんでした。ブラウザの設定や容量を確認してください');
        }
      },

      // --- 月のデータ ---
      latestMonthBefore(key) {
        return Object.keys(this.data.months).filter(k => k < key).sort().pop() || null;
      },

      // 記録がない月は、前の月から費目・目標・仕事を引き継いだ下書きを作る（実績は0）
      buildMonth(key) {
        const prevKey = this.latestMonthBefore(key);
        if (!prevKey) {
          const nextKey = Object.keys(this.data.months).filter(k => k > key).sort()[0];
          if (!nextKey) return defaultMonth();
          const base = this.data.months[nextKey];
          return {
            jobs: base.jobs.map(j => ({ ...j, id: generateId() })),
            expenses: {
              fixed: base.expenses.fixed.map(e => ({ ...e, id: generateId(), actual: 0 })),
              variable: base.expenses.variable.map(e => ({ ...e, id: generateId(), actual: 0 }))
            }
          };
        }
        const prev = this.data.months[prevKey];
        const { start } = monthRange(key);
        // 期間が前の月までで終わっている仕事は引き継がない
        let jobs = prev.jobs.filter(j => !j.endDate || j.endDate >= start).map(j => ({ ...j, id: generateId() }));
        if (jobs.length === 0) jobs = [{ id: generateId(), name: 'メインの仕事', amount: 0, startDate: '', endDate: '' }];
        return {
          jobs,
          expenses: {
            fixed: prev.expenses.fixed.map(e => ({ ...e, id: generateId(), actual: 0 })),
            variable: prev.expenses.variable.map(e => ({ ...e, id: generateId(), actual: 0 }))
          }
        };
      },

      // 表示中の月のデータ。まだ記録がなければ下書き（保存はしない）
      get month() {
        if (!this.data.months[this.viewKey]) {
          if (!this._draft || this._draftKey !== this.viewKey) {
            this._draft = this.buildMonth(this.viewKey);
            this._draftKey = this.viewKey;
          }
          return this._draft;
        }
        return this.data.months[this.viewKey];
      },
      isDraft() { return !this.data.months[this.viewKey]; },

      // 何か変更したら、表示中の月を正式に保存する
      save() {
        if (this.isDraft()) {
          this.data.months[this.viewKey] = this._draft;
          this._draft = null;
          this.renderNotice();
        }
        this.persist();
        this.updateSummaryUI();
      },

      shiftMonth(delta) { this.setMonth(shiftKey(this.viewKey, delta)); },
      goThisMonth() { this.setMonth(monthKey()); },
      setMonth(key) {
        this.viewKey = key;
        this.followCurrent = key === monthKey();
        this._draft = null;
        this.activeJobId = null;
        this.renderAll();
      },

      jobInMonth(job) {
        const { start, end } = monthRange(this.viewKey);
        if (job.startDate && job.startDate > end) return false;
        if (job.endDate && job.endDate < start) return false;
        return true;
      },

      // --- 計算 ---
      getTotals(m = this.month) {
        const totalIncome = m.jobs.filter(j => this.jobInMonth(j)).reduce((sum, job) => sum + (Number(job.amount) || 0), 0);
        const calc = (items) => items.reduce((acc, item) => ({
          target: acc.target + (Number(item.target) || 0),
          actual: acc.actual + (Number(item.actual) || 0)
        }), { target: 0, actual: 0 });
        const fixed = calc(m.expenses.fixed);
        const variable = calc(m.expenses.variable);
        const totalActualExpenses = fixed.actual + variable.actual;
        const totalTargetExpenses = fixed.target + variable.target;
        return {
          totalIncome,
          totalFixedActual: fixed.actual,
          totalVarActual: variable.actual,
          totalActualExpenses,
          totalTargetExpenses,
          balance: totalIncome - totalActualExpenses,
          expensesDifference: totalTargetExpenses - totalActualExpenses
        };
      },

      // --- 仕事 ---
      setActiveJob(id) {
        this.activeJobId = id;
        this.renderJobTabs();
        this.renderJobDetails();
      },

      addJob() {
        const newJob = { id: generateId(), name: '新規の仕事', amount: 0, startDate: '', endDate: '' };
        this.month.jobs.push(newJob);
        this.activeJobId = newJob.id;
        this.save();
        this.renderJobTabs();
        this.renderJobDetails();
        const input = document.querySelector('#job-details-container input[type=text]');
        if (input) { input.focus(); input.select(); }
      },

      updateJob(id, field, value) {
        const job = this.month.jobs.find(j => j.id === id);
        if (!job) return;
        job[field] = field === 'amount' ? parseAmount(value) : value;
        this.save();
        if (field === 'name') this.renderJobTabs();
        if (field === 'startDate' || field === 'endDate') this.renderJobPeriodNote(job);
      },

      deleteJob(id) {
        const m = this.month;
        if (m.jobs.length <= 1) return;
        const job = m.jobs.find(j => j.id === id);
        this.confirm('仕事を削除しますか？', `「${job.name || '無名'}」を${monthLabel(this.viewKey)}の記録から削除します。`, () => {
          m.jobs = m.jobs.filter(j => j.id !== id);
          if (this.activeJobId === id) this.activeJobId = m.jobs[0].id;
          this.save();
          this.renderJobTabs();
          this.renderJobDetails();
        });
      },

      // --- 支出 ---
      addExpense(type) {
        const newExpense = { id: generateId(), name: '', target: 0, actual: 0 };
        this.month.expenses[type].push(newExpense);
        this.save();
        this.renderExpenseList(type);
        const input = document.querySelector(`#expense-container-${newExpense.id} input[type=text]`);
        if (input) input.focus();
      },

      deleteExpense(type, id) {
        const m = this.month;
        const item = m.expenses[type].find(e => e.id === id);
        const run = () => {
          m.expenses[type] = m.expenses[type].filter(exp => exp.id !== id);
          this.save();
          this.renderExpenseList(type);
        };
        // 何も入力していない項目は確認なしで消す
        if (!item.name && !item.target && !item.actual) return run();
        this.confirm('項目を削除しますか？', `「${item.name || '分類名なし'}」を${monthLabel(this.viewKey)}の記録から削除します。`, run);
      },

      updateExpense(type, id, field, value) {
        const exp = this.month.expenses[type].find(e => e.id === id);
        if (!exp) return;
        exp[field] = field === 'name' ? value : parseAmount(value);
        this.save();
        this.updateExpenseItemUI(id, exp);
      },

      // 金額欄：入力中はそのまま、欄を離れたらカンマ区切りに整える
      formatField(el) {
        el.value = formatNumber(parseAmount(el.value));
      },

      // --- 確認ダイアログ ---
      setupConfirm() {
        $('confirm-cancel').onclick = () => this.closeConfirm();
        $('confirm-ok').onclick = () => { const h = this.confirmHandler; this.closeConfirm(); if (h) h(); };
        $('confirm-modal').onclick = (e) => { if (e.target.id === 'confirm-modal') this.closeConfirm(); };
      },
      confirm(title, text, onOk, okLabel = '削除', danger = true) {
        $('confirm-title').textContent = title;
        $('confirm-text').textContent = text;
        $('confirm-ok').textContent = okLabel;
        $('confirm-ok').className = `flex-1 h-11 rounded-xl text-white text-sm font-semibold ${danger ? 'bg-app-danger' : 'bg-app-accent'}`;
        this.confirmHandler = onOk;
        $('confirm-modal').classList.remove('hidden');
      },
      closeConfirm() {
        this.confirmHandler = null;
        $('confirm-modal').classList.add('hidden');
      },

      // --- バックアップ ---
      openBackup() {
        let last = null;
        try { last = localStorage.getItem(BACKUP_KEY); } catch (e) {}
        const el = $('backup-last');
        if (last) {
          const d = new Date(last);
          el.textContent = `最後にファイルに保存した日: ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
          el.className = 'text-xs font-semibold mt-3 num text-gray-600';
        } else {
          el.textContent = 'まだファイルに保存していません';
          el.className = 'text-xs font-semibold mt-3 text-app-danger';
        }
        $('backup-modal').classList.remove('hidden');
      },
      closeBackup() { $('backup-modal').classList.add('hidden'); },

      exportData() {
        const now = new Date();
        const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        const payload = { app: 'MoneyLog', version: 2, exportedAt: now.toISOString(), months: this.data.months };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `moneylog-backup-${stamp}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        try { localStorage.setItem(BACKUP_KEY, now.toISOString()); } catch (e) {}
        this.openBackup();
        this.toast('バックアップファイルを保存しました');
      },

      importData(input) {
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let data = null;
          try {
            const json = JSON.parse(reader.result);
            data = cleanData(json);
            // 以前の形式（1か月分だけ）のファイルにも対応
            if (!data && json && (json.jobs || json.expenses)) data = { version: 2, months: { [monthKey()]: cleanMonth(json) } };
          } catch (e) {}
          if (!data || Object.keys(data.months).length === 0) {
            this.toast('MoneyLogのバックアップファイルではないようです');
            return;
          }
          const keys = Object.keys(data.months).sort();
          const range = keys.length > 1 ? `${monthLabel(keys[0])}〜${monthLabel(keys[keys.length - 1])}` : monthLabel(keys[0]);
          this.confirm('このファイルを読み込みますか？', `${range}の${keys.length}か月分の記録です。今このブラウザにあるデータは、ファイルの内容に置き換わります。`, () => {
            this.data = data;
            this.persist();
            this.closeBackup();
            this.setMonth(this.data.months[monthKey()] ? monthKey() : keys[keys.length - 1]);
            this.toast('バックアップから読み込みました');
          }, '読み込む', false);
        };
        reader.onerror = () => this.toast('ファイルを読み込めませんでした');
        reader.readAsText(file);
      },

      toast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
      },

      // --- 表示 ---
      renderAll() {
        const m = this.month;
        if (!m.jobs.find(j => j.id === this.activeJobId)) this.activeJobId = m.jobs[0].id;
        $('current-month-display').textContent = monthLabel(this.viewKey);
        const cur = monthKey();
        $('today-month-btn').classList.toggle('hidden', this.viewKey === cur);
        $('summary-month-label').textContent = this.viewKey === cur ? '今月' : `${Number(this.viewKey.split('-')[1])}月`;
        this.renderNotice();
        this.renderJobTabs();
        this.renderJobDetails();
        this.renderExpenseList('fixed');
        this.renderExpenseList('variable');
        this.updateSummaryUI();
      },

      renderNotice() {
        const el = $('month-notice');
        if (this.isDraft()) {
          const prevKey = this.latestMonthBefore(this.viewKey);
          const nextKey = Object.keys(this.data.months).filter(k => k > this.viewKey).sort()[0];
          const baseKey = prevKey || nextKey;
          el.textContent = baseKey
            ? `${monthLabel(this.viewKey)}の記録はまだありません。${monthLabel(baseKey)}の費目・目標・仕事を引き継いでいます（実績は0から）。入力すると保存されます。`
            : `${monthLabel(this.viewKey)}の記録はまだありません。入力すると保存されます。`;
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      },

      updateSummaryUI() {
        const totals = this.getTotals();

        const balEl = $('summary-balance');
        balEl.textContent = `${totals.balance > 0 ? '+' : ''}${formatCurrency(totals.balance)}`;
        balEl.className = `text-3xl sm:text-4xl font-bold tracking-tighter num ${totals.balance >= 0 ? 'text-app-success' : 'text-app-danger'}`;

        const prevKey = shiftKey(this.viewKey, -1);
        const prev = this.data.months[prevKey];
        if (prev) {
          const pb = this.getTotalsFor(prevKey).balance;
          $('summary-prev').textContent = `前月 ${pb > 0 ? '+' : ''}${formatCurrency(pb)}`;
        } else {
          $('summary-prev').textContent = '';
        }

        $('summary-income').textContent = formatCurrency(totals.totalIncome);
        $('summary-expense').textContent = formatCurrency(totals.totalActualExpenses);
        $('summary-target').textContent = `全体の支出目標（予算）: ${formatCurrency(totals.totalTargetExpenses)}`;

        const isOver = totals.totalActualExpenses > totals.totalTargetExpenses;
        const diffBadge = $('summary-diff-badge');
        diffBadge.textContent = `残枠: ${formatDiff(totals.expensesDifference)}`;
        diffBadge.className = `px-2 py-0.5 rounded-full text-[11px] font-bold num whitespace-nowrap ${isOver ? 'bg-app-danger/10 text-app-danger' : 'bg-app-success/10 text-app-success'}`;

        const bar = $('summary-progress-bar');
        const pct = totals.totalTargetExpenses ? (totals.totalActualExpenses / totals.totalTargetExpenses) * 100 : (totals.totalActualExpenses ? 100 : 0);
        bar.style.width = `${Math.min(pct, 100)}%`;
        bar.className = `h-full rounded-full transition-all duration-700 ease-out ${isOver ? 'bg-app-danger' : 'bg-app-accent'}`;

        $('fixed-total-display').textContent = `合計: ${formatCurrency(totals.totalFixedActual)}`;
        $('variable-total-display').textContent = `合計: ${formatCurrency(totals.totalVarActual)}`;
      },

      getTotalsFor(key) {
        const saved = this.viewKey;
        this.viewKey = key;
        const t = this.getTotals(this.data.months[key]);
        this.viewKey = saved;
        return t;
      },

      renderJobTabs() {
        const container = $('job-tabs-container');
        let html = '';
        this.month.jobs.forEach(job => {
          const isActive = job.id === this.activeJobId;
          const out = !this.jobInMonth(job);
          const classes = isActive ? 'bg-app-accent text-white shadow-md' : 'bg-gray-50 text-gray-600 hover:bg-gray-100';
          html += `<button onclick="App.setActiveJob('${job.id}')" class="px-4 h-11 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-200 flex-shrink-0 ${classes} ${out ? 'opacity-60' : ''}">${escapeHTML(job.name) || '無名'}</button>`;
        });
        html += `<button onclick="App.addJob()" class="w-11 h-11 rounded-full bg-gray-50 text-gray-600 hover:bg-gray-100 flex items-center justify-center flex-shrink-0 transition-colors" aria-label="仕事を追加"><svg class="ic"><use href="#i-plus"/></svg></button>`;
        container.innerHTML = html;
      },

      renderJobDetails() {
        const container = $('job-details-container');
        const job = this.month.jobs.find(j => j.id === this.activeJobId);
        if (!job) {
          container.innerHTML = '<p class="text-gray-400 text-sm p-3">仕事が選択されていません</p>';
          return;
        }
        const deleteBtnHtml = this.month.jobs.length > 1 ? `
          <button onclick="App.deleteJob('${job.id}')" class="absolute top-2 right-2 text-gray-400 hover:text-app-danger transition-colors p-2" aria-label="仕事を削除">
            <svg class="ic"><use href="#i-trash"/></svg>
          </button>` : '';

        container.innerHTML = `
          ${deleteBtnHtml}
          <div class="space-y-0 mt-1 ${deleteBtnHtml ? 'pr-8' : ''}">
            <div class="flex items-center justify-between py-1 border-b border-gray-100">
              <span class="text-xs font-medium text-gray-600 flex-shrink-0 w-16">仕事名</span>
              <input type="text" value="${escapeHTML(job.name)}" oninput="App.updateJob('${job.id}', 'name', this.value)" placeholder="メインの仕事" maxlength="30" class="w-full bg-transparent text-right text-app-text text-sm focus:outline-none focus:ring-2 focus:ring-app-accent/20 rounded-lg px-2 py-1 h-11 transition-all">
            </div>
            <div class="flex items-center justify-between py-1 border-b border-gray-100">
              <span class="text-xs font-medium text-gray-600 flex-shrink-0 w-10">期間</span>
              <div class="flex items-center gap-1 w-full justify-end">
                <input type="date" value="${job.startDate}" onchange="App.updateJob('${job.id}', 'startDate', this.value)" class="bg-transparent text-app-text text-[13px] focus:outline-none h-11 px-0.5 w-[115px] min-w-0">
                <span class="text-gray-300 text-xs">〜</span>
                <input type="date" value="${job.endDate}" onchange="App.updateJob('${job.id}', 'endDate', this.value)" class="bg-transparent text-app-text text-[13px] focus:outline-none h-11 px-0.5 w-[115px] min-w-0">
              </div>
            </div>
            <div class="flex items-center justify-between py-1">
              <span class="text-xs font-medium text-gray-600 flex-shrink-0 w-16">給与額</span>
              <div class="flex items-center w-full justify-end">
                <span class="text-sm text-gray-400">¥</span>
                <input type="text" inputmode="numeric" value="${formatNumber(job.amount)}" oninput="App.updateJob('${job.id}', 'amount', this.value)" onblur="App.formatField(this)" placeholder="0" class="w-full bg-transparent text-right text-app-text text-sm focus:outline-none focus:ring-2 focus:ring-app-accent/20 rounded-lg px-2 py-1 h-11 transition-all num">
              </div>
            </div>
            <p id="job-period-note" class="text-[11px] text-app-danger font-medium pt-1 hidden"></p>
          </div>`;
        this.renderJobPeriodNote(job);
      },

      renderJobPeriodNote(job) {
        const el = $('job-period-note');
        if (!el) return;
        let msg = '';
        if (job.startDate && job.endDate && job.startDate > job.endDate) msg = '期間の開始日が終了日より後になっています。';
        else if (!this.jobInMonth(job)) msg = `期間が${monthLabel(this.viewKey)}に入っていないので、この月の収入には含めていません。`;
        el.textContent = msg;
        el.classList.toggle('hidden', !msg);
        this.renderJobTabs();
      },

      expenseBarWidth(item) {
        if (!item.target) return item.actual ? 100 : 0;
        return Math.min((item.actual / item.target) * 100, 100);
      },

      renderExpenseList(type) {
        const container = $(`${type}-expenses-list`);
        const items = this.month.expenses[type];
        if (items.length === 0) {
          container.innerHTML = '<p class="text-sm text-center text-gray-400 py-3">項目がありません</p>';
          return;
        }
        container.innerHTML = items.map(item => {
          const isOver = item.actual > item.target;
          const diff = item.target - item.actual;
          return `
            <div id="expense-container-${item.id}" class="flex flex-col p-3 bg-gray-50 rounded-xl border border-gray-100/50">
              <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                <input type="text" value="${escapeHTML(item.name)}" oninput="App.updateExpense('${type}', '${item.id}', 'name', this.value)" placeholder="分類名" maxlength="30" class="font-medium text-sm text-app-text bg-transparent focus:outline-none focus:ring-2 focus:ring-app-accent/20 rounded px-1 -ml-1 h-11 w-full sm:w-1/3">
                <div class="flex-1 flex items-center gap-1.5">
                  <div class="flex-1 relative min-w-0">
                    <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-[10px] text-gray-400 pointer-events-none">目標</span>
                    <input type="text" inputmode="numeric" value="${formatNumber(item.target)}" oninput="App.updateExpense('${type}', '${item.id}', 'target', this.value)" onblur="App.formatField(this)" placeholder="0" class="w-full h-11 bg-white rounded-lg pl-8 pr-2 text-sm focus:outline-none focus:ring-2 focus:ring-app-accent/20 border border-gray-100 text-right num">
                  </div>
                  <div class="flex-1 relative min-w-0">
                    <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-[10px] text-gray-400 pointer-events-none">実績</span>
                    <input id="expense-actual-${item.id}" type="text" inputmode="numeric" value="${formatNumber(item.actual)}" oninput="App.updateExpense('${type}', '${item.id}', 'actual', this.value)" onblur="App.formatField(this)" placeholder="0" class="w-full h-11 bg-white rounded-lg pl-8 pr-2 text-sm focus:outline-none focus:ring-2 focus:ring-app-accent/20 border ${isOver ? 'border-app-danger/30 text-app-danger' : 'border-gray-100'} text-right font-medium num">
                  </div>
                  <button onclick="App.deleteExpense('${type}', '${item.id}')" class="w-11 h-11 flex items-center justify-center text-gray-300 hover:text-app-danger transition-colors rounded-lg flex-shrink-0" aria-label="項目を削除">
                    <svg class="ic"><use href="#i-trash"/></svg>
                  </button>
                </div>
              </div>
              <div class="mt-2 flex items-center gap-2">
                <div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                  <div id="expense-bar-${item.id}" class="h-full rounded-full transition-all duration-500 ${isOver ? 'bg-app-danger' : 'bg-app-success'}" style="width: ${this.expenseBarWidth(item)}%"></div>
                </div>
                <span id="expense-diff-${item.id}" class="text-[11px] font-bold whitespace-nowrap num ${isOver ? 'text-app-danger' : 'text-app-success'}">残枠: ${formatDiff(diff)}</span>
              </div>
            </div>`;
        }).join('');
      },

      updateExpenseItemUI(id, item) {
        const isOver = item.actual > item.target;
        const diffEl = $(`expense-diff-${id}`);
        const barEl = $(`expense-bar-${id}`);
        const actualInputEl = $(`expense-actual-${id}`);
        if (diffEl) {
          diffEl.textContent = `残枠: ${formatDiff(item.target - item.actual)}`;
          diffEl.className = `text-[11px] font-bold whitespace-nowrap num ${isOver ? 'text-app-danger' : 'text-app-success'}`;
        }
        if (barEl) {
          barEl.style.width = `${this.expenseBarWidth(item)}%`;
          barEl.className = `h-full rounded-full transition-all duration-500 ${isOver ? 'bg-app-danger' : 'bg-app-success'}`;
        }
        if (actualInputEl) {
          actualInputEl.classList.toggle('border-app-danger/30', isOver);
          actualInputEl.classList.toggle('text-app-danger', isOver);
          actualInputEl.classList.toggle('border-gray-100', !isOver);
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
